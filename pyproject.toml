[project]
name = "runhealth"
version = "0.1.0"
description = "System-health reports for HPC batch job logs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
dependencies = [
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
pdf = ["weasyprint>=61"]

[project.scripts]
runhealth = "runhealth.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/runhealth"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
