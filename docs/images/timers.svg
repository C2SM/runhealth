<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 192" width="900" height="192" class="rh-svg" role="img" aria-label="Top-level timer totals per rank group, with per-rank spread" preserveAspectRatio="xMidYMid meet" data-plot="238,6,594,180" font-size="11px" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><style>:root { --bg: #fcfcfb; --panel: #ffffff; --panel-2: #f5f4f0; --ink: #16150f; --muted: #75736b; --line: #e2e1d9; --line-2: #cecdc3; --ok: #2f8f5b; --info: #3d7fd6; --warn: #c98216; --fail: #c8452f; --grid: #e8e7e0; --axis: #c1bfb4; --tick: #6a6862; --whisker: #3f3e38; --shadow: 0 1px 2px rgba(20,18,10,.05), 0 4px 14px rgba(20,18,10,.04); --syn-cmt: #75736b; --syn-dir: #c98216; --syn-str: #2f8f5b; --syn-var: #0f8c95; --syn-kw: #8b5cc7; --syn-cmd: #3d7fd6; --s0: #3d7fd6; --s1: #c98216; --s2: #2f8f5b; --s3: #8b5cc7; --s4: #c8452f; --s5: #0f8c95; --s6: #a6742a; --p0: #3d75b6; --p1: #35669f; --p2: #2d5789; --p3: #264a74; --p4: #1f3d60; --p5: #18314d; --p6: #4b6b8c; }
.rh-svg { width: 100%; height: auto; display: block; overflow: visible;
  font: 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.rh-svg .grid { stroke: var(--grid); stroke-width: 1; }
.rh-svg .ax-line { stroke: var(--axis); stroke-width: 1; }
.rh-svg .tick { fill: var(--tick); font-size: 10.5px; font-weight: 500; }
.rh-svg .ax-label { fill: var(--ink); font-size: 11px; font-weight: 700;
  letter-spacing: .01em; }
.rh-svg .panel-title { fill: var(--ink); font-size: 12.5px; font-weight: 700; }
.rh-svg .row-label { fill: var(--tick); font-size: 10.5px; font-weight: 600; }
.rh-svg .val { fill: var(--ink); font-size: 10.5px; font-weight: 600; }
.rh-svg .in-bar { fill: #fff; font-size: 10.5px; font-weight: 700; }
.rh-svg .in-bar.dim { font-weight: 500; opacity: .9; }
.rh-svg .ref { stroke: var(--muted); stroke-width: 1; }
.rh-svg .dash { stroke-dasharray: 4 3; }
.rh-svg .ref-label { fill: var(--tick); font-size: 10.5px; font-weight: 600; }
.rh-svg .whisker { stroke: var(--whisker); stroke-width: 1.1; opacity: .75; }
.rh-svg .io-tick { stroke: var(--muted); stroke-width: 1.2; opacity: .7; }
.rh-svg .legend-text { fill: var(--ink); font-size: 11px; font-weight: 600; }

/* Paint modes. A class sets --c; these three decide what is done with it. */
.rh-svg .fill { fill: var(--c); stroke: none; }
.rh-svg .stroke { fill: none; stroke: var(--c); stroke-width: 1.6;
  stroke-linejoin: round; stroke-linecap: round; }
.rh-svg .area { fill: var(--c); stroke: none; opacity: .13; }
.rh-svg .range { fill: none; stroke: var(--c); stroke-width: 5;
  stroke-linecap: round; opacity: .6; }
.rh-svg .s0 { --c: var(--s0); } .rh-svg .s1 { --c: var(--s1); }
.rh-svg .s2 { --c: var(--s2); } .rh-svg .s3 { --c: var(--s3); }
.rh-svg .s4 { --c: var(--s4); } .rh-svg .s5 { --c: var(--s5); }
.rh-svg .s6 { --c: var(--s6); }
.rh-svg .p0 { --c: var(--p0); } .rh-svg .p1 { --c: var(--p1); }
.rh-svg .p2 { --c: var(--p2); } .rh-svg .p3 { --c: var(--p3); }
.rh-svg .p4 { --c: var(--p4); } .rh-svg .p5 { --c: var(--p5); }
.rh-svg .p6 { --c: var(--p6); }
.rh-svg .lv-ok { --c: var(--ok); } .rh-svg .lv-info { --c: var(--info); }
.rh-svg .lv-warn { --c: var(--warn); } .rh-svg .lv-fail { --c: var(--fail); }
.rh-svg .ink { --c: var(--ink); }
