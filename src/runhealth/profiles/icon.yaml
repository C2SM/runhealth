# ICON (icon-model.org). Written against what any ICON run prints with
# msg_level >= 1 and timers_level > 0, not against one experiment.
name: icon
description: "ICON atmosphere/ocean model: progress, timer report, coupling"
priority: 10

detect:
  - 'master_control: start model initialization'
  - 'Timer report, ranks'
  - 'mo_[a-z_]+:[a-z_]+:'
  # A run that dies during MPI startup prints none of the above, but the
  # runscript header it echoes first is just as conclusive.
  - '# ICON run script'
  - 'make_target_runscript'
  - 'export ICON_THREADS'

# The generated runscript echoes a copy of itself and closes it with this
# line, so a second copy means a second attempt appended to the same file.
attempt_boundary:
  - '^end_of_job_script'

settings:
  progress_label: time steps
  throughput_label: SYPD
  model_time_field: model_time
  progress_series: timestep
  timer_table: timers
  timer_root: total
  timer_columns:
    total: total avg (s)
    min: total min (s)
    max: total max (s)
    min_rank: total min rank
    max_rank: total max rank
    calls: "# calls"
    pes: "# PEs"
  io_timers: [wrt_output, wait_for_async_io, write_restart, restart]
  coupling_timers: [coupling, cpl_init, cpl_init_def_comp, cpl_init_enddef]
  # Timers on which a component blocks until its partner delivers. Labels a
  # given ICON version does not print simply never match.
  coupling_wait_timers: [cpl_get, cpl_1stget, cpl_put]
  # A coupled run prints one timer report per component, headed by the ranks
  # it covers; this is what assigns each report to atmo or ocean.
  timer_group_ranks: 'ranks\s+(\d+)\s*-\s*(\d+)'
  # The startup banner describes the binary; these of its entries describe
  # the run instead, so they are neither shown with it nor compared.
  build_block: build
  build_ignore: [date, time, user, host]

fields:
  model_version:
    re: '^\s*version: (\S+)'
    contains: 'version:'
  model_revision:
    re: '^\s*revision: (\S+)'
    contains: 'revision:'
  model_branch:
    re: '^\s*local branch: (\S+)'
    contains: 'local branch:'
  yac_version:
    re: 'coupled mode with YAC version: (\S+)'
    contains: 'YAC version:'
  mpi_library:
    re: 'MPI VERSION\s*:\s*(.+?)\.\.\.'
    contains: 'MPI VERSION'
  fortran_compiler:
    re: '^\s*Fortran: (.+)$'
    contains: 'Fortran:'
  atmo_ranks:
    re: 'atmo runs on\s+(\d+) mpi processes'
    contains: ' mpi processes'
    cast: int
  ocean_ranks:
    re: 'ocean runs on\s+(\d+) mpi processes'
    contains: ' mpi processes'
    cast: int
  nproma:
    re: 'set_nproma_nblocks: Using namelist nproma=\s*(\d+)'
    contains: 'Using namelist nproma'
    cast: int
  experiment_start:
    re: '^\s*Start date\s*: (\S+)'
    contains: 'Start date'
  finish_status:
    re: '^Script run successfully: (.+)'
    contains: 'Script run successfully'
    keep: last

keyvalues:
  # The banner ICON prints first: the binary, the source it was built from,
  # and one nested entry per model component.
  build:
    re: '^\s*executable: '
    contains: 'executable:'
    block: true

series:
  timestep:
    re: 'Time step:\s+(\d+) model time (\d\S* \S+)'
    contains: 'Time step:'
    fields: [step, model_time]
    cast: {step: int}
    role: progress
    # A long run reports more steps than a series may hold, so bin them.
    bin: last
  output_write:
    re: 'Write output at: ?(\d\S* \S+)'
    contains: 'Write output at'
    fields: [model_time]
    role: io
  restart_write:
    re: 'restart: finished:\s*([\d.]+)GB of data in ([\d.]+)s \(([\d.]+)GB/s\)'
    contains: 'restart: finished'
    fields: [gigabytes, seconds, gb_per_s]
    cast: {gigabytes: float, seconds: float, gb_per_s: float}
    role: io
  # Global wind maxima, printed on every dynamics substep. msg_level >= 7
  # adds the level, msg_level >= 13 also the rank; below 7 only the values.
  max_vn:
    re: 'MAXABS VN, W(?: in domain *\d+:)? +(\S+?)(?:(?: at level|\s*\(on proc # *(\d+), level) +(\d+))?(?:\)?,| )'
    contains: 'MAXABS VN, W'
    fields: [vn, rank, level]
    cast: {vn: float, rank: int, level: int}
    role: stability
    peak: vn
    label: horizontal wind |vn|
    unit: m/s
    figure: Maximum wind speed
  max_w:
    re: 'MAXABS VN, W(?: in domain *\d+:)? +\S+?(?:(?: at level|\s*\(on proc # *\d+, level) +\d+\)?,)? +(\S+?)(?:(?: at level|\s*\(on proc # *(\d+), level) +(\d+))?(?:\)?,|\s*$)'
    contains: 'MAXABS VN, W'
    fields: [w, rank, level]
    cast: {w: float, rank: int, level: int}
    role: stability
    peak: w
    label: vertical wind |w|
    unit: m/s
    figure: Maximum wind speed
  # Printed only in the CFL watch mode, i.e. once the CFL number approaches
  # vcfl_threshold. A value that overflows the field prints as asterisks.
  vertical_cfl:
    re: 'Maximum vertical CFL number in domain +\d+: *(\S+)'
    contains: 'Maximum vertical CFL'
    fields: [cfl]
    cast: {cfl: float}
    role: stability
    peak: cfl
    label: vertical CFL
    figure: CFL number
  horizontal_cfl:
    re: 'Maximum horizontal CFL number in domain +\d+: *(\S+)'
    contains: 'Maximum horizontal CFL'
    fields: [cfl]
    cast: {cfl: float}
    role: stability
    peak: cfl
    label: horizontal CFL
    figure: CFL number
  cfl_watch:
    re: 'High CFL number for horizontal or vertical advection'
    contains: 'High CFL number'
    role: stability
    label: CFL watch mode entries
    figure: CFL number
  substeps_increased:
    re: 'Number of dynamics substeps in domain +\d+ increased to +(\d+)'
    contains: 'substeps in domain'
    fields: [substeps]
    cast: {substeps: int}
    role: stability
    label: dynamics substep increases
    figure: CFL number

# Markers cut the wall clock into phases. The label names the stretch that
# *starts* at the marker, which is what the timeline reads out.
markers:
  model_init:
    re: 'master_control: start model initialization'
    contains: start model initialization
    label: model init
  restart_read:
    re: 'normal exit from read_restart_files'
    contains: read_restart_files
    label: after restart read
  coupling_init:
    # ICON writes both "the atmosphere coupling frame" and "the coupling
    # frame atmosphere-ocean", so match the phrase either way round.
    re: 'Constructing the .*coupling frame'
    contains: coupling frame
    label: coupling setup
  first_step:
    re: 'Time step:\s+1 model time'
    contains: 'Time step:'
    label: time loop
  timer_report:
    re: 'Timer report, ranks'
    contains: 'Timer report'
    label: timer report
  cleanup:
    re: 'clean-up finished'
    contains: clean-up finished
    label: cleanup

# Limits for the peak series above, as <series>_warn and <series>_fail. The
# warnings sit just above what healthy global runs at 2.5 km reach, the
# failures well beyond anything physical.
thresholds:
  max_vn_warn: 400
  max_vn_fail: 1000
  max_w_warn: 100
  max_w_fail: 1000

groups:
  icon_warning:
    re: 'WARNING PE:\s+(\d+)\s+(\S+)'
    contains: 'WARNING PE:'
    key: 2
    label: ICON warnings
    claim: true

tables:
  timers:
    start: 'Timer report, ranks (\d+)-(\d+)'
    contains: 'Timer report, ranks'
    kind: ruled
    nesting: '^(\s*)L '
    durations: [t_min, t_avg, t_max]

outcome:
  # Printed before the output is redirected into the stamping helper, when
  # that helper could not be started.
  - re: '^ERROR: (timewarp failed to start.*)'
    contains: 'timewarp failed to start'
    level: fail
  - re: '^Script FAILED: (.+)'
    contains: 'Script FAILED'
    level: fail
  - re: '^Script run successfully: (.+)'
    contains: 'Script run successfully'
    level: ok
